name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jadav104
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23A78BFA&color_dots=%232d3343,%237C3AED33,%237C3AED88,%23A78BFA,%2322D3EE
            dist/snake-light.svg?palette=github-light&color_snake=%237C3AED&color_dots=%23FFFFFF,%237C3AED33,%237C3AED88,%237C3AED,%230891B2

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       
